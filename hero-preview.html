<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Thread — Hero Studio</title>
<style>
 :root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif}
 *{box-sizing:border-box}
 body{margin:0;background:#0d1a27;color:#e7f6f3;overflow:hidden}
 canvas{display:block}
 .panel{position:absolute;top:18px;left:18px;width:260px;background:#0b1a28d8;border:1px solid #6fa9a655;border-radius:10px;padding:16px;backdrop-filter:blur(8px)}
 h1{font-size:13px;letter-spacing:2.4px;margin:0 0 4px;color:#a6ffdf}
 p{font-size:12px;color:#9db7c4;margin:0 0 14px;line-height:1.5}
 label{display:block;font-size:11px;letter-spacing:1.2px;color:#b9d3dc;margin:12px 0 5px;text-transform:uppercase}
 select,input[type=range]{width:100%}
 select{padding:8px;background:#17324a;color:#fff;border:1px solid #5d93a0;border-radius:6px;font:inherit}
 .row{display:flex;gap:8px;align-items:center;margin-top:12px}
 button{flex:1;padding:8px 10px;background:#17324a;color:#cffff0;border:1px solid #5d93a0;border-radius:6px;font:inherit;cursor:pointer}
 button[aria-pressed=true]{background:#a6ffdf;color:#0b2a30}
 .stat{position:absolute;bottom:16px;left:18px;font-size:11px;color:#7fa0ae}
</style>
  <script type="module" crossorigin src="./assets/hero-OEysApKB.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/emotes-3UtzZy3K.js">
  <link rel="modulepreload" crossorigin href="./assets/hero-orientation-GYvOiVJY.js">
</head>
<body>
<div class="panel" id="panel">
 <h1>HERO STUDIO</h1>
 <p>Low-poly rigged hero, <span id="tris">0</span> triangles, 19 bones. Drag to orbit.</p>
 <label for="pose">Animation</label><select id="pose"></select>
 <label for="speed">Playback speed</label><input id="speed" type="range" min="0" max="2" step=".05" value="1">
 <label for="color">Suit colour</label><select id="color"></select>
 <div class="row"><button id="play" aria-pressed="true">Playing</button><button id="wobble" aria-pressed="true">PS1 wobble</button><button id="wire" aria-pressed="false">Wireframe</button></div>
 <div class="row"><button data-view="three">3/4</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button></div>
</div>
<div class="stat">Query options: ?clip=run&amp;u=.25&amp;mode=views | ?clip=run&amp;mode=sheet&amp;n=8&amp;view=side</div>
</body>
</html>
